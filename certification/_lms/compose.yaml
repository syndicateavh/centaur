services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: lms_dev
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - lms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_dev -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: node:22-alpine
    working_dir: /app
    init: true
    command: sh -c "npm ci && npm run db:migrate && npm run db:seed:local && npm run db:seed:pilot"
    environment:
      NODE_ENV: development
      MIGRATION_DATABASE_URL: postgresql://lms_dev:local_dev_only@database:5432/${POSTGRES_DB:-centaur_lms}
    volumes:
      - .:/app
      - lms_node_modules:/app/node_modules
    depends_on:
      database:
        condition: service_healthy

  app:
    image: node:22-alpine
    working_dir: /app
    init: true
    command: npm run dev -- --hostname 0.0.0.0
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LMS_PUBLIC_URL: ${LMS_PUBLIC_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${LMS_APP_USER}:${LMS_APP_PASSWORD}@database:5432/${POSTGRES_DB}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      LMS_AUTH_ENABLED: ${LMS_AUTH_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - lms_node_modules:/app/node_modules
      - lms_next_cache:/app/.next
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  lms_postgres_data:
  lms_node_modules:
  lms_next_cache:
