name: LMS foundation CI

on:
  push:
    paths:
      - "certification/**"
      - ".github/workflows/lms-ci.yml"
  pull_request:
    paths:
      - "certification/**"
      - ".github/workflows/lms-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: certification
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: centaur_lms
          POSTGRES_USER: centaur_lms
          POSTGRES_PASSWORD: centaur_lms_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U centaur_lms -d centaur_lms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://centaur_lms:centaur_lms_local_only@127.0.0.1:5432/centaur_lms
      REDIS_URL: redis://127.0.0.1:6379
      API_PORT: "4000"
      WEB_ORIGIN: http://localhost:5173
      VITE_API_BASE_URL: http://localhost:4000/api/v1
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: certification/package-lock.json
      - run: npm ci
      - run: npm run db:check
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Build production API image
        run: docker build --pull -f Dockerfile.api -t centaur-lms-api:ci .
      - name: Build production worker image
        run: docker build --pull -f Dockerfile.worker -t centaur-lms-worker:ci .
      - name: Build production web image
        run: docker build --pull -f Dockerfile.web --build-arg VITE_API_BASE_URL=https://academy.example.com/api/v1 -t centaur-lms-web:ci .
